name: LDXP Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact upstream version already prepared on this branch
        required: true
        default: '1.3.14'
        type: string
      publish:
        description: Publish the verified candidate to the public LDXP update channel
        required: true
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  RELEASE_REPOSITORY: gucang0/tools

jobs:
  prepare:
    name: Validate source and create release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: version
        name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "${REQUESTED_VERSION}" = "${PACKAGE_VERSION}"
          test "${REQUESTED_VERSION}" = "${TAURI_VERSION}"
          echo "value=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Create release metadata
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          cat > release-notes.md <<EOF
          Custom LDXP build based on Cockpit Tools v${VERSION}.

          - Keeps the upstream application feature set.
          - Uses the LDXP updater channel and controlled promotion configuration.
          - Source revision: ${SOURCE_REVISION}
          EOF
          date -u +"%Y-%m-%dT%H:%M:%SZ" > published-at.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            release-notes.md
            published-at.txt
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows x64
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies and typecheck
        shell: pwsh
        run: |
          npm ci
          npm run typecheck
      - name: Build signed Windows packages
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci
      - name: Stage release assets
        shell: pwsh
        run: node scripts/release/stage_release_assets.cjs --platform windows --assets-dir target/release/bundle --output-dir release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 1

  build-macos-aarch64:
    name: Build macOS Apple Silicon
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build signed Apple Silicon packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci --target aarch64-apple-darwin
      - name: Stage release assets
        run: node scripts/release/stage_release_assets.cjs --platform macos --mac-arch aarch64 --assets-dir target/aarch64-apple-darwin/release/bundle --output-dir release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 1

  build-macos-x86_64:
    name: Build macOS Intel
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build signed Intel packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci --target x86_64-apple-darwin
      - name: Stage release assets
        run: node scripts/release/stage_release_assets.cjs --platform macos --mac-arch x64 --assets-dir target/x86_64-apple-darwin/release/bundle --output-dir release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 1

  build-macos-universal:
    name: Build macOS universal DMG
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build signed universal package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci --target universal-apple-darwin
      - name: Stage release assets
        run: node scripts/release/stage_release_assets.cjs --platform macos --mac-arch universal --assets-dir target/universal-apple-darwin/release/bundle --output-dir release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish approved candidate
    if: ${{ inputs.publish }}
    needs:
      - prepare
      - build-windows
      - build-macos-aarch64
      - build-macos-x86_64
      - build-macos-universal
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.LDXP_RELEASE_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-assets'
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-metadata
      - name: Create draft public release
        run: |
          gh release create "v${VERSION}" \
            --repo "${RELEASE_REPOSITORY}" \
            --draft \
            --title "Cockpit Tools v${VERSION} LDXP" \
            --notes-file release-metadata/release-notes.md || \
          gh release edit "v${VERSION}" \
            --repo "${RELEASE_REPOSITORY}" \
            --draft \
            --title "Cockpit Tools v${VERSION} LDXP" \
            --notes-file release-metadata/release-notes.md
      - name: Upload packages and updater assets
        run: gh release upload "v${VERSION}" release-assets/* --repo "${RELEASE_REPOSITORY}" --clobber
      - name: Build updater manifests
        run: |
          node scripts/release/build_target_latest_json.cjs \
            --version "${VERSION}" \
            --repo "${RELEASE_REPOSITORY}" \
            --assets-dir release-assets \
            --notes-file release-metadata/release-notes.md \
            --published-at "$(cat release-metadata/published-at.txt)" \
            --targets "windows-x86_64-msi,windows-x86_64-nsis,darwin-aarch64-app,darwin-x86_64-app" \
            --output-dir target-manifests
          node scripts/release/build_ldxp_latest_json.cjs \
            --version "${VERSION}" \
            --manifests-dir target-manifests \
            --notes-file release-metadata/release-notes.md \
            --output latest.json
      - name: Generate checksums and upload manifests
        run: |
          (
            cd release-assets
            find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs -r sha256sum
          ) > SHA256SUMS.txt
          gh release upload "v${VERSION}" target-manifests/*.json latest.json SHA256SUMS.txt --repo "${RELEASE_REPOSITORY}" --clobber
      - name: Publish and verify public update channel
        run: |
          gh release edit "v${VERSION}" --repo "${RELEASE_REPOSITORY}" --draft=false --latest
          node scripts/release/verify_published_updater_manifests.cjs \
            --version "${VERSION}" \
            --repo "${RELEASE_REPOSITORY}" \
            --targets "windows-x86_64-msi,windows-x86_64-nsis,darwin-aarch64-app,darwin-x86_64-app" \
            --legacy
