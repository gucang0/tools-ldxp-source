name: Cockpit Tools Release
run-name: Cockpit Tools v${{ inputs.version }} | ${{ inputs.publish && 'publish' || 'dry-run' }} | ${{ inputs.source_commit || github.sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact official Cockpit Tools version prepared on this ref
        required: true
        type: string
      upstream_commit:
        description: Exact official tag commit (40 lowercase hex characters)
        required: true
        type: string
      source_commit:
        description: Immutable customized source commit; workflow always runs from main
        required: false
        default: ''
        type: string
      candidate_branch:
        description: Candidate branch to clean up only after verified source promotion
        required: false
        default: ''
        type: string
      publish:
        description: Publish after every release gate passes
        required: true
        default: false
        type: boolean

concurrency:
  group: cockpit-tools-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  RELEASE_REPOSITORY: gucang0/tools
  UPSTREAM_REPOSITORY: jlcodes99/cockpit-tools
  RELEASE_TARGETS: windows-x86_64-msi,windows-x86_64-nsis,darwin-universal,darwin-aarch64-app,darwin-x86_64-app

permissions:
  contents: read

jobs:
  validate:
    name: Validate source, diff, and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify version and official source identity
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          [[ "${REQUESTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${REQUESTED_UPSTREAM_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${REQUESTED_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${REQUESTED_SOURCE_COMMIT}"
          git merge-base --is-ancestor "${GITHUB_SHA}" HEAD
          if [[ -n "${CANDIDATE_BRANCH}" ]]; then
            test "${CANDIDATE_BRANCH}" = "automation/candidate-v${REQUESTED_VERSION}"
          fi
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null || true
          git fetch --force upstream "refs/tags/v${REQUESTED_VERSION}:refs/tags/upstream-v${REQUESTED_VERSION}"
          ACTUAL_COMMIT="$(git rev-parse "upstream-v${REQUESTED_VERSION}^{commit}")"
          test "${ACTUAL_COMMIT}" = "${REQUESTED_UPSTREAM_COMMIT}"
          git merge-base --is-ancestor "${ACTUAL_COMMIT}" HEAD
          node scripts/release/validate_noncommercial_customization.cjs --version "${REQUESTED_VERSION}"
          echo "value=${REQUESTED_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "source_commit=${REQUESTED_SOURCE_COMMIT}" >> "${GITHUB_OUTPUT}"
      - name: Reject customization outside the allowlist
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD:.github/workflows)" = "$(git rev-parse "${GITHUB_SHA}:.github/workflows")"
          git diff --name-only "upstream-v${VERSION}..HEAD" \
            | sed '/^\.github\/workflows\//d' \
            | sort -u > actual-diff.txt
          sed '/^\.github\/workflows\//d' .github/ldxp-customization-allowlist.txt \
            | sort -u > allowed-diff.txt
          comm -23 actual-diff.txt allowed-diff.txt > unexpected-diff.txt
          if [ -s unexpected-diff.txt ]; then
            echo "Unexpected customization files:"
            cat unexpected-diff.txt
            exit 1
          fi
          cat actual-diff.txt
      - name: Install, test, and build the validated frontend once
        run: |
          npm ci
          node --test scripts/release/*.test.cjs
          npm test --if-present
          npm run build --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
      - name: Create release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/v${VERSION}" --jq .body > release-notes.md
          test -s release-notes.md
          date -u +"%Y-%m-%dT%H:%M:%SZ" > published-at.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: |
            release-notes.md
            published-at.txt
            actual-diff.txt
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Build and inspect Windows x64
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ldxp-release-v1
          shared-key: windows-x64
          cache-on-failure: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify the official Windows installer payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path official-installer | Out-Null
          $assetName = "Cockpit.Tools_$env:EXPECTED_VERSION`_x64-setup.exe"
          gh release download "v$env:EXPECTED_VERSION" --repo $env:UPSTREAM_REPOSITORY --pattern $assetName --dir official-installer
          $setup = Get-Item (Join-Path official-installer $assetName)
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          $signature = Get-AuthenticodeSignature $setup.FullName
          "Official installer SHA256: $hash"
          "Official installer Authenticode status (informational): $($signature.Status)"
          if ($setup.VersionInfo.ProductVersion -notlike "$env:EXPECTED_VERSION*") {
            throw "Official installer product version mismatch: $($setup.VersionInfo.ProductVersion)"
          }
          & 7z x $setup.FullName '-oofficial-unpacked' -y | Out-Null
          $payload = @(Get-ChildItem official-unpacked -Recurse -File -Filter 'cockpit-tools.exe')
          if ($payload.Count -ne 1) { throw "Expected one official cockpit-tools.exe payload; found $($payload.Count)" }
          if ($payload[0].VersionInfo.ProductVersion -notlike "$env:EXPECTED_VERSION*") {
            throw "Official payload product version mismatch: $($payload[0].VersionInfo.ProductVersion)"
          }
          $bytes = [System.IO.File]::ReadAllBytes($payload[0].FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ('Official payload is not x64: 0x{0:X4}' -f $machine) }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: dist
      - name: Install dependencies and build the Windows application without signing secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm test --if-present
          if ($LASTEXITCODE -ne 0) { throw 'Windows TypeScript tests failed' }
          if (-not (Test-Path -LiteralPath 'dist/index.html')) { throw 'Validated frontend artifact is missing dist/index.html' }
          npx tauri build --ci --no-bundle --config src-tauri/tauri.release.conf.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/AppData/Local/tauri
          key: ldxp-tauri-windows-${{ hashFiles('package-lock.json') }}
          restore-keys: ldxp-tauri-windows-
      - name: Bundle Windows packages without updater signing secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/release/bundle_with_retry.cjs --ci --config src-tauri/tauri.release.conf.json
      - name: Verify Windows application version and x64 architecture
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item 'target/release/cockpit-tools.exe'
          if ($exe.VersionInfo.ProductVersion -notlike "$env:EXPECTED_VERSION*") {
            throw "Product version mismatch: $($exe.VersionInfo.ProductVersion)"
          }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ('Unexpected PE machine: 0x{0:X4}' -f $machine) }
          $signature = Get-AuthenticodeSignature $exe.FullName
          "Authenticode status (informational): $($signature.Status)"
      - name: Stage and validate unsigned Windows release assets
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/release/stage_release_assets.cjs --platform windows --assets-dir target/release/bundle --output-dir unsigned-assets
          $setup = @(Get-ChildItem unsigned-assets -File -Filter "Cockpit.Tools_$env:EXPECTED_VERSION`_x64-setup.exe")
          $msi = @(Get-ChildItem unsigned-assets -File -Filter "Cockpit.Tools_$env:EXPECTED_VERSION`_x64_en-US.msi")
          if ($setup.Count -ne 1 -or $msi.Count -ne 1) { throw 'Expected one NSIS and one MSI package' }
          if (@(Get-ChildItem unsigned-assets -File -Filter '*.sig').Count -ne 0) {
            throw 'Unsigned build unexpectedly produced updater signatures'
          }
          if ($setup[0].VersionInfo.ProductVersion -notlike "$env:EXPECTED_VERSION*") {
            throw "NSIS product version mismatch: $($setup[0].VersionInfo.ProductVersion)"
          }
          & 7z x $setup[0].FullName '-owindows-package-unpacked' -y | Out-Null
          $payloads = @(Get-ChildItem windows-package-unpacked -Recurse -File -Filter 'cockpit-tools.exe')
          $sidecars = @(Get-ChildItem windows-package-unpacked -Recurse -File -Filter 'cockpit-cliproxy.exe')
          if ($payloads.Count -ne 1 -or $sidecars.Count -ne 1) {
            throw "Expected one packaged app and sidecar; found app=$($payloads.Count), sidecar=$($sidecars.Count)"
          }
          foreach ($binary in @($payloads[0], $sidecars[0])) {
            $bytes = [System.IO.File]::ReadAllBytes($binary.FullName)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) { throw ('Packaged binary {0} is not x64: 0x{1:X4}' -f $binary.Name, $machine) }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unsigned-assets
          path: unsigned-assets
          if-no-files-found: error
          retention-days: 3

  build-macos-universal:
    name: Build and inspect macOS Universal
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ldxp-release-v1
          shared-key: macos-universal
          cache-on-failure: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: dist
      - name: Install dependencies and build the Universal application without signing secrets
        run: |
          npm ci
          test -f dist/index.html
          npx tauri build --ci --no-bundle --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
      - name: Bundle Universal packages without updater signing secrets
        run: node scripts/release/bundle_with_retry.cjs --ci --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
      - name: Verify Universal application architecture and version
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          APP="target/universal-apple-darwin/release/bundle/macos/Cockpit Tools.app"
          BINARY="${APP}/Contents/MacOS/cockpit-tools"
          SIDECAR="${APP}/Contents/MacOS/cockpit-cliproxy"
          test -f "${BINARY}"
          test -f "${SIDECAR}"
          lipo "${BINARY}" -verify_arch x86_64 arm64
          lipo "${SIDECAR}" -verify_arch x86_64 arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Contents/Info.plist")" = "${EXPECTED_VERSION}"
          codesign --display --verbose=2 "${APP}" || true
      - name: Create the Universal updater archive
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir='target/universal-apple-darwin/release/bundle/macos'
          app_name='Cockpit Tools.app'
          test -d "${bundle_dir}/${app_name}"
          COPYFILE_DISABLE=1 tar -czf "${bundle_dir}/${app_name}.tar.gz" -C "${bundle_dir}" "${app_name}"
      - name: Stage and validate unsigned macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/stage_release_assets.cjs --platform macos --mac-arch universal --assets-dir target/universal-apple-darwin/release/bundle --output-dir unsigned-assets
          test "$(find unsigned-assets -maxdepth 1 -type f -name '*_universal.dmg' | wc -l | tr -d ' ')" = 1
          test "$(find unsigned-assets -maxdepth 1 -type f -name '*_universal.app.tar.gz' | wc -l | tr -d ' ')" = 1
          test "$(find unsigned-assets -maxdepth 1 -type f -name '*.sig' | wc -l | tr -d ' ')" = 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-universal-unsigned-assets
          path: unsigned-assets
          if-no-files-found: error
          retention-days: 3

  regression-tests:
    name: Test Go sidecar and Rust core
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum
      - name: Test Go gateway
        working-directory: sidecars/cockpit-cliproxy
        run: go test ./...
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ldxp-release-v1
          shared-key: linux-core-tests
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install core test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libnm-dev
      - name: Test Rust core without user credentials
        run: cargo test --locked --package cockpit-core -- --test-threads=1

  sign-updater-assets:
    name: Sign updater assets in an isolated runner
    needs:
      - validate
      - build-windows
      - build-macos-universal
      - regression-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-unsigned-assets'
          merge-multiple: true
          path: release-assets
      - name: Install the pinned Tauri updater signer without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir signer
          cd signer
          npm init -y >/dev/null
          expected_integrity='sha512-3xDdXL5omQ3sPfBfdC8fCtDKcnyV7OqyzQgfyT5P3+zY6lcPqIYKQBvUasNvppi21RSdfhy44ttvJmftb0PCDw=='
          test "$(npm view @tauri-apps/cli@2.9.6 dist.integrity)" = "${expected_integrity}"
          npm install --ignore-scripts --no-audit --no-fund --save-exact @tauri-apps/cli@2.9.6
          test "$(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")" = '2.9.6'
      - name: Sign updater assets
        shell: bash
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*_x64-setup.exe' -o -name '*_x64_en-US.msi' -o -name '*_universal.app.tar.gz' \) | sort)
          test "${#assets[@]}" = 3
          for asset in "${assets[@]}"; do
            signer/node_modules/.bin/tauri signer sign "${asset}"
            test -s "${asset}.sig"
          done
      - name: Verify updater signatures before export
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: RWS+DpkEsugM2xPKsiK/TX1zUlayIvY6X35nscFQBnlF+jD5TQ9HJzy4
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          for asset in release-assets/*_x64-setup.exe release-assets/*_x64_en-US.msi release-assets/*_universal.app.tar.gz; do
            base64 --decode "${asset}.sig" > "${asset}.minisig"
            minisign -Vm "${asset}" -x "${asset}.minisig" -P "${TAURI_UPDATER_PUBLIC_KEY}"
            rm "${asset}.minisig"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 3

  verify-candidate:
    name: Verify signed candidate and updater manifests (also on dry runs)
    needs:
      - validate
      - build-windows
      - build-macos-universal
      - sign-updater-assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-assets
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release-metadata
      - name: Verify updater signatures cryptographically
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          PUBKEY="$(node -e "const c=require('./src-tauri/tauri.conf.json'); const s=Buffer.from(c.plugins.updater.pubkey,'base64').toString('utf8'); console.log(s.split(/\r?\n/).find(x=>x.startsWith('RW')))" )"
          test -n "${PUBKEY}"
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 7
          test -s "release-assets/Cockpit.Tools_${VERSION}_universal.dmg"
          test -s "release-assets/Cockpit.Tools_${VERSION}_x64-setup.exe"
          test -s "release-assets/Cockpit.Tools_${VERSION}_x64_en-US.msi"
          test -s release-assets/Cockpit.Tools_universal.app.tar.gz
          for asset in release-assets/*_x64-setup.exe release-assets/*_x64_en-US.msi release-assets/*_universal.app.tar.gz; do
            test -s "${asset}"
            test -s "${asset}.sig"
            base64 --decode "${asset}.sig" > "${asset}.minisig"
            minisign -Vm "${asset}" -x "${asset}.minisig" -P "${PUBKEY}"
            rm "${asset}.minisig"
          done
      - name: Build and validate updater manifests locally
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/build_target_latest_json.cjs \
            --version "${VERSION}" \
            --repo "${RELEASE_REPOSITORY}" \
            --assets-dir release-assets \
            --notes-file release-metadata/release-notes.md \
            --published-at "$(cat release-metadata/published-at.txt)" \
            --targets "${RELEASE_TARGETS}" \
            --output-dir target-manifests
          node scripts/release/build_ldxp_latest_json.cjs \
            --version "${VERSION}" \
            --manifests-dir target-manifests \
            --notes-file release-metadata/release-notes.md \
            --output latest.json
          node scripts/release/verify_local_release_candidate.cjs \
            --version "${VERSION}" \
            --repo "${RELEASE_REPOSITORY}" \
            --assets-dir release-assets \
            --manifests-dir target-manifests \
            --legacy latest.json \
            --targets "${RELEASE_TARGETS}"
          (
            for file in release-assets/* target-manifests/*.json latest.json; do
              sha256sum "${file}"
            done
          ) | sed -E 's#  (release-assets/|target-manifests/)#  #' > SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-candidate
          if-no-files-found: error
          retention-days: 3
          path: |
            release-assets
            target-manifests
            release-metadata
            latest.json
            SHA256SUMS.txt

  publish:
    name: Publish verified candidate transaction
    if: ${{ inputs.publish }}
    needs: [validate, verify-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cockpit-tools-publication
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-candidate
      - name: Verify the candidate can still fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse origin/main)" != "${SOURCE_COMMIT}"
      - name: Record and guard the current stable release inside publication lock
        id: previous
        env:
          GH_TOKEN: ${{ secrets.LDXP_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/${RELEASE_REPOSITORY}/releases/latest" --jq .tag_name)"
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          node -e 'const {compareVersions}=require("./scripts/release/release_state.cjs"); if(compareVersions(process.argv[1],process.argv[2].slice(1))<=0) throw Error("Refusing duplicate release or downgrade");' "${VERSION}" "${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
      - name: Create draft and upload the verified candidate
        id: draft
        env:
          GH_TOKEN: ${{ secrets.LDXP_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          EXISTING_COUNT="$(
            gh api "repos/${RELEASE_REPOSITORY}/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"v${VERSION}\")] | length"
          )"
          if [[ "${EXISTING_COUNT}" != "0" ]]; then
            echo "Release v${VERSION} already exists; refusing to overwrite it."
            exit 1
          fi
          RELEASE_ID=""
          RELEASE_ID="$(
            jq -n \
              --arg tag "v${VERSION}" \
              --arg name "Cockpit Tools v${VERSION}" \
              --rawfile body release-metadata/release-notes.md \
              '{
                tag_name: $tag,
                target_commitish: "main",
                name: $name,
                body: $body,
                draft: true,
                prerelease: false,
                make_latest: "false"
              }' | gh api --method POST \
                "repos/${RELEASE_REPOSITORY}/releases" \
                --input - \
                --jq .id
          )"
          test -n "${RELEASE_ID}"
          echo "release_id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"
      - name: Upload verified candidate assets
        env:
          GH_TOKEN: ${{ secrets.LDXP_RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          for source in release-assets/* target-manifests/*.json latest.json SHA256SUMS.txt; do
            name="$(basename "${source}")"
            encoded_name="$(jq -rn --arg value "${name}" '$value | @uri')"
            curl \
              --fail-with-body \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --request POST \
              --url "https://uploads.github.com/repos/${RELEASE_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${encoded_name}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@${source}" \
              >/dev/null
          done
      - name: Verify every draft asset through the GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LDXP_RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir downloaded-assets
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api "repos/${RELEASE_REPOSITORY}/releases/assets/${asset_id}" \
              -H 'Accept: application/octet-stream' > "downloaded-assets/${asset_name}"
          done < <(gh api "repos/${RELEASE_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | [.id,.name] | @tsv')
          EXPECTED_COUNT="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          EXPECTED_COUNT="$((EXPECTED_COUNT + $(find target-manifests -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ') + 2))"
          ACTUAL_COUNT="$(find downloaded-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "${ACTUAL_COUNT}" = "${EXPECTED_COUNT}"
          for source in release-assets/* target-manifests/*.json latest.json SHA256SUMS.txt; do
            name="$(basename "${source}")"
            test -f "downloaded-assets/${name}"
            test "$(sha256sum "${source}" | cut -d' ' -f1)" = "$(sha256sum "downloaded-assets/${name}" | cut -d' ' -f1)"
          done
      - name: Publish as the new Latest release
        id: publish_release
        env:
          GH_TOKEN: ${{ secrets.LDXP_RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${RELEASE_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -F prerelease=false -f make_latest=true >/dev/null
      - name: Verify the public update channel
        id: online_verify
        env:
          GH_TOKEN: ${{ secrets.LDXP_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/verify_published_updater_manifests.cjs \
            --version "${VERSION}" \
            --repo "${RELEASE_REPOSITORY}" \
            --targets "${RELEASE_TARGETS}" \
            --legacy
          RELEASE_JSON="$(gh api "repos/${RELEASE_REPOSITORY}/releases/tags/v${VERSION}")"
          test "$(jq -r .draft <<<"${RELEASE_JSON}")" = false
          test "$(jq -r .prerelease <<<"${RELEASE_JSON}")" = false
          test "$(jq '.assets | length' <<<"${RELEASE_JSON}")" = 14
          test "$(gh api "repos/${RELEASE_REPOSITORY}/releases/latest" --jq .tag_name)" = "v${VERSION}"
      - name: Fast-forward the customized source branch
        id: promote_source
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
          if [[ -n "${CANDIDATE_BRANCH}" ]]; then
            REMOTE_CANDIDATE="$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}" | cut -f1)"
            if [[ "${REMOTE_CANDIDATE}" == "${SOURCE_COMMIT}" ]]; then
              git push origin --delete "${CANDIDATE_BRANCH}"
            fi
          fi
      - name: Recover only this transaction and preserve a promoted source release
        if: ${{ always() && (failure() || cancelled()) && steps.draft.outputs.release_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.LDXP_RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          PREVIOUS_LATEST_TAG: ${{ steps.previous.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/release_state.cjs recover "${RELEASE_REPOSITORY}" "${VERSION}" "${RELEASE_ID}" "${PREVIOUS_LATEST_TAG}" "${SOURCE_COMMIT}"
