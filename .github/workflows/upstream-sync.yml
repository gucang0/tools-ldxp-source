name: Check Official Release Every 6 Hours

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_check:
        description: Run the official release check immediately
        required: true
        default: true
        type: boolean
      dry_run:
        description: Build and verify without publishing a Release
        default: false
        type: boolean
      validate_current:
        description: Also validate an already published version (requires dry_run)
        default: false
        type: boolean

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-and-prepare:
    name: Detect and prepare an official-source candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Detect, prepare and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          VALIDATE_CURRENT: ${{ inputs.validate_current || false }}
        run: node scripts/release/sync_release.cjs
