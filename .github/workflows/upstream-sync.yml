name: Check Official Release Every 36 Hours

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
    inputs:
      force_check:
        description: Ignore the 36-hour interval gate
        required: true
        default: true
        type: boolean

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: jlcodes99/cockpit-tools
  RELEASE_REPOSITORY: gucang0/tools
  CHECK_ANCHOR_EPOCH: '1786591020'

jobs:
  check-and-prepare:
    name: Detect and prepare a guarded candidate
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Enforce one official check per 36 hours
        id: interval
        env:
          FORCE_CHECK: ${{ inputs.force_check || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${FORCE_CHECK}" == "true" ]]; then
            echo "Manual dispatch requested an immediate official release check."
            echo "due=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          NOW_EPOCH="$(date -u +%s)"
          if (( NOW_EPOCH < CHECK_ANCHOR_EPOCH )); then
            echo "The 36-hour check schedule has not reached its anchor time."
            echo "due=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          ELAPSED_TWELVE_HOUR_SLOTS=$(( (NOW_EPOCH - CHECK_ANCHOR_EPOCH) / 43200 ))
          if (( ELAPSED_TWELVE_HOUR_SLOTS % 3 != 0 )); then
            echo "Official release check is not due in this 12-hour slot."
            echo "due=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Official release check is due today."
          echo "due=true" >> "${GITHUB_OUTPUT}"
      - name: Read the latest stable official release
        if: ${{ steps.interval.outputs.due == 'true' }}
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest")"
          TAG="$(jq -r .tag_name <<<"${RELEASE}")"
          DRAFT="$(jq -r .draft <<<"${RELEASE}")"
          PRERELEASE="$(jq -r .prerelease <<<"${RELEASE}")"
          [[ "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          test "${DRAFT}" = false
          test "${PRERELEASE}" = false
          VERSION="${BASH_REMATCH[1]}"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          IS_NEWER="$(node -e '
            const [candidate,current]=process.argv.slice(1).map(v=>v.split(".").map(Number));
            const newer=candidate.some((part,index)=>part>current[index] && candidate.slice(0,index).every((value,i)=>value===current[i]));
            process.stdout.write(String(newer));
          ' "${VERSION}" "${CURRENT_VERSION}")"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "newer=${IS_NEWER}" >> "${GITHUB_OUTPUT}"
          echo "Official latest: ${TAG}; customized source: v${CURRENT_VERSION}; newer=${IS_NEWER}"
      - name: Stop when there is no new official version
        if: ${{ steps.interval.outputs.due == 'true' && steps.upstream.outputs.newer != 'true' }}
        run: echo 'No new stable official Cockpit Tools release.'
      - name: Fetch and verify the exact official tag
        if: ${{ steps.interval.outputs.due == 'true' && steps.upstream.outputs.newer == 'true' }}
        id: source
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null || true
          git fetch --force upstream "refs/tags/v${VERSION}:refs/tags/upstream-v${VERSION}"
          COMMIT="$(git rev-parse "upstream-v${VERSION}^{commit}")"
          PACKAGE_VERSION="$(git show "upstream-v${VERSION}:package.json" | jq -r .version)"
          TAURI_VERSION="$(git show "upstream-v${VERSION}:src-tauri/tauri.conf.json" | jq -r .version)"
          CARGO_VERSION="$(git show "upstream-v${VERSION}:src-tauri/Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n1)"
          test "${PACKAGE_VERSION}" = "${VERSION}"
          test "${TAURI_VERSION}" = "${VERSION}"
          test "${CARGO_VERSION}" = "${VERSION}"
          echo "commit=${COMMIT}" >> "${GITHUB_OUTPUT}"
      - name: Verify the official Windows x64 release asset exists
        if: ${{ steps.interval.outputs.due == 'true' && steps.upstream.outputs.newer == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="Cockpit.Tools_${VERSION}_x64-setup.exe"
          ASSET_COUNT="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/v${VERSION}" --jq "[.assets[] | select(.name == \"${EXPECTED}\")] | length")"
          test "${ASSET_COUNT}" = 1
      - name: Prepare a clean merge candidate
        if: ${{ steps.interval.outputs.due == 'true' && steps.upstream.outputs.newer == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          UPSTREAM_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/candidate-v${VERSION}"
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Candidate branch ${BRANCH} already exists. Resolve or delete it before retrying."
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "${BRANCH}"
          set +e
          git merge --no-ff --no-commit "upstream-v${VERSION}"
          MERGE_STATUS=$?
          set -e
          if [ ${MERGE_STATUS} -ne 0 ]; then
            mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
            if [ "${#CONFLICTS[@]}" -eq 1 ] && [ "${CONFLICTS[0]}" = ".github/workflows/release.yml" ]; then
              git rm --force .github/workflows/release.yml
            else
              printf 'Merge conflicts block publication:\n%s\n' "${CONFLICTS[@]}"
              exit 1
            fi
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          node scripts/release/update_upstream_baseline.cjs --version "${VERSION}" --commit "${UPSTREAM_COMMIT}"
          node scripts/release/validate_noncommercial_customization.cjs --version "${VERSION}"
          ACTUAL_DIFF="${RUNNER_TEMP}/actual-diff.txt"
          ALLOWED_DIFF="${RUNNER_TEMP}/allowed-diff.txt"
          UNEXPECTED_DIFF="${RUNNER_TEMP}/unexpected-diff.txt"
          git diff --name-only "upstream-v${VERSION}" | sort -u > "${ACTUAL_DIFF}"
          sort -u .github/ldxp-customization-allowlist.txt > "${ALLOWED_DIFF}"
          comm -23 "${ACTUAL_DIFF}" "${ALLOWED_DIFF}" > "${UNEXPECTED_DIFF}"
          if [ -s "${UNEXPECTED_DIFF}" ]; then
            echo 'Unexpected customization outside the allowlist:'
            cat "${UNEXPECTED_DIFF}"
            exit 1
          fi
          git add --all
          git commit -m "feat: sync customization with Cockpit Tools v${VERSION}"
          git push origin "HEAD:refs/heads/${BRANCH}"
      - name: Dispatch the strict build and automatic publication
        if: ${{ steps.interval.outputs.due == 'true' && steps.upstream.outputs.newer == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          UPSTREAM_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          gh workflow run ldxp-release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "automation/candidate-v${VERSION}" \
            -f version="${VERSION}" \
            -f upstream_commit="${UPSTREAM_COMMIT}" \
            -f publish=true
